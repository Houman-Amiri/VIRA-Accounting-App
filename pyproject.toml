[project]
name = "vira-accounting"
version = "1.0.0"
description = "V.I.R.A — Persian accounting & operations app for 3D-printing businesses (FastAPI + SQLite)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "SQLAlchemy>=2.0.30",
    "alembic>=1.13",
    "py-moneyed>=1.1",
    "Babel>=2.15",
    "jdatetime>=5.0",
    "polars>=1.0",
    "openpyxl>=3.1",
    "ofxtools>=0.9",
    "mt940>=0.5",
    "rapidfuzz>=3.9",
    "scikit-learn>=1.4",
    "httpx>=0.27",
    "tenacity>=9.0",
    "Jinja2>=3.1",
    "WeasyPrint>=62",
    "Pillow>=10.0",
    "python-multipart>=0.0.9",
    "pwdlib[argon2]>=0.2",
    "pyotp>=2.9",
    "qrcode>=7.4",
    "itsdangerous>=2.2",
    "APScheduler>=3.10",
    "structlog>=24.1",
    "cryptography>=42.0",
    "defusedxml>=0.7",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "bsdiff4>=1.2.6",
    "ruff>=0.5",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "types-itsdangerous",
    "types-python-dateutil",
]
ocr = ["pytesseract>=0.3.10"]
llm = ["instructor>=1.3", "litellm>=1.40"]
beancount = ["beancount>=2.3"]
s3 = ["boto3>=1.34"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
packages = ["app"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
