name: Assemble and inspect private native source kit

on:
  push:
    paths: ['.github/workflows/pdf-source-kit.yml', 'scripts/pdf_source_kit.py', 'scripts/check_pdf_build_license.py', 'backend/tests/test_pdf_source_kit.py', 'docs/dependencies/pdf-build-script-license-scope.json']
  pull_request:
    paths: ['.github/workflows/pdf-source-kit.yml', 'scripts/pdf_source_kit.py', 'scripts/check_pdf_build_license.py', 'backend/tests/test_pdf_source_kit.py', 'docs/dependencies/pdf-build-script-license-scope.json']

permissions:
  contents: read
  actions: read

jobs:
  kit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch only the exact successful original source producer
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(python -c 'import json; print(json.load(open("docs/dependencies/pdf-source-proof-run.json"))["run_id"])')
          gh api "repos/$GH_REPO/actions/runs/$run_id" > "$RUNNER_TEMP/producer.json"
          python - "$RUNNER_TEMP/producer.json" <<'PY'
          import json,sys
          actual=json.load(open(sys.argv[1])); pin=json.load(open('docs/dependencies/pdf-source-proof-run.json'))
          assert all(actual[k] == pin[v] for k,v in [('id','run_id'),('head_sha','head_sha'),('path','workflow_path')])
          assert actual['conclusion']=='success'
          PY
          gh run download "$run_id" --name private-pdf-source-evidence --dir "$RUNNER_TEMP/producer"
      - name: Assemble with standard library only; no app dependencies installed
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find "$RUNNER_TEMP/producer" -name corresponding-source.zip)
          python -I -S scripts/pdf_source_kit.py --archive "$archive" --out reports/source-kit > reports-source-kit-receipt.json
          python - <<'PY'
          import json
          x=json.load(open('reports-source-kit-receipt.json'))
          print('::notice title=Native source kit receipt::'+json.dumps(x))
          PY
      - name: Recipient-style isolated verification and actual safe source extraction
        shell: bash
        run: |
          set -euo pipefail
          hash=$(python -c 'import json;print(json.load(open("reports-source-kit-receipt.json"))["kit_manifest_sha256"])')
          python -I -S reports/source-kit/licensed-build-files/scripts/pdf_source_kit.py --verify reports/source-kit --expected-manifest-sha256 "$hash" --extract-sources "$RUNNER_TEMP/extracted-preferred-sources" > reports-source-kit-recipient.json
          python -I -S reports/source-kit/licensed-build-files/scripts/pdf_source_kit.py --verify reports/source-kit --expected-manifest-sha256 "$hash"
          python - <<'PY'
          import hashlib,json,os,pathlib
          x=json.load(open('reports-source-kit-recipient.json'))
          base=pathlib.Path(os.environ['RUNNER_TEMP'],'extracted-preferred-sources')
          inv=json.load(open('reports/source-kit/evidence/pdf-runtime-win64-source-inventory.json'))
          for name,expected in inv['source_packages'].items():
            root=base/'sources'/name
            files=sorted((p for p in root.rglob('*') if p.is_file() or p.is_symlink()),key=lambda p:p.relative_to(root).as_posix())
            h=hashlib.sha256()
            for p in files:
              data=os.readlink(p).encode() if p.is_symlink() else p.read_bytes()
              kind=b'symlink' if p.is_symlink() else b'file'
              h.update(p.relative_to(root).as_posix().encode()+b'\0'+kind+b'\0'+hashlib.sha256(data).hexdigest().encode()+b'\n')
            assert len(files)==expected['patched_source_files']
            assert h.hexdigest()==expected['patched_source_tree_sha256'],name
          x['actual_extracted_source_trees_rehashed']=len(inv['source_packages'])
          pathlib.Path('reports-source-kit-recipient.json').write_text(json.dumps(x,indent=2)+'\n')
          links=list(p for p in pathlib.Path(__import__('os').environ['RUNNER_TEMP'],'extracted-preferred-sources').rglob('*') if p.is_symlink())
          assert len(links)==x['verified_sources']['source_symlinks']==21
          assert x['verified_sources']['packages']==20 and x['verified_sources']['source_entries']==25505
          assert x['external_manifest_hash_checked'] is True
          print('::notice title=Native source kit recipient proof::'+json.dumps(x))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: private-native-source-kit-not-recipient-publication
          path: |
            reports/source-kit/
            reports-source-kit-receipt.json
            reports-source-kit-recipient.json
          retention-days: 90
          if-no-files-found: error
