name: Inspect failed modified source transport without executing its code
on:
  push:
    paths: ['.github/workflows/pdf-modified-source-diagnostics.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39158539677
          name: private-complete-modified-sources-no-dlls
          path: ${{ runner.temp }}/failed-transport
      - name: Compare transferred members against the independently pinned producer manifest
        shell: bash
        run: |
          python -I -S - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'],'failed-transport','modified-source-kit')
          manifest=root/'modified-kit-manifest.json'
          assert hashlib.sha256(manifest.read_bytes()).hexdigest()=='1a609db6a0c50512bff5edcd68246bf469ea74e4f06f1d1c011ffe1e8ca60658'
          expected=set(json.loads(manifest.read_text())['files'])|{'modified-kit-manifest.json'}
          actual={p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}
          missing=sorted(expected-actual);unexpected=sorted(actual-expected)
          report={'failed_run_id':39158539677,'producer_manifest_sha256':hashlib.sha256(manifest.read_bytes()).hexdigest(),'missing_files':missing,'unexpected_files':unexpected,'artifact_code_executed':False}
          print('::notice title=Modified source transport diagnostic::'+json.dumps(report))
          assert missing==['original-kit/licensed-build-files/.github/workflows/pdf-source-proof.yml'] and not unexpected
          PY
