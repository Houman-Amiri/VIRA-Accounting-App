name: Phase 3 private installer and byte-transport preflight NOT native acceptance

on:
  push:
    paths: ['.github/workflows/phase3-native-preflight.yml', 'installer/vira.iss', 'backend/app/private_installed_source.py', 'scripts/private_source_update.py', 'backend/tests/test_private_source_update.py', 'backend/tests/test_private_installed_cmd.py', 'scripts/vira_updater.ps1', 'uv.lock']
  pull_request:
    paths: ['.github/workflows/phase3-native-preflight.yml', 'installer/vira.iss', 'backend/app/private_installed_source.py', 'scripts/private_source_update.py', 'backend/tests/test_private_source_update.py', 'backend/tests/test_private_installed_cmd.py', 'scripts/vira_updater.ps1', 'uv.lock']

permissions:
  contents: read
  actions: read

jobs:
  windows-preflight:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Preserve original failed preflight diagnostics, no success relabeling
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          python -c "import json,subprocess; text=subprocess.check_output(['gh','api','repos/${{ github.repository }}/actions/jobs/119167635625/logs']).decode('utf-8',errors='replace')[-16000:]; [print('::notice title=Original Phase 3 failed preflight::'+json.dumps({'tail':text[i:i+2300]})) for i in range(0,len(text),2300)]"
      - name: Synthetic strict-delta and anchor controls; no native execution claim
        shell: pwsh
        run: |
          $sync = (uv sync --frozen --all-extras 2>&1 | Out-String)
          $syncCode = $LASTEXITCODE
          Write-Host $sync
          if ($syncCode -ne 0) {
            $last = $sync.Substring([Math]::Max(0, $sync.Length - 14000))
            for ($i=0; $i -lt $last.Length; $i+=2300) { Write-Host ('::error title=Phase 3 sync failure::' + (($last.Substring($i,[Math]::Min(2300,$last.Length-$i)) -replace '%','%25') -replace "`n",'%0A' -replace "`r",'%0D')) }
            throw 'Dependency sync failed'
          }
          $output = (uv run pytest backend/tests/test_private_source_update.py backend/tests/test_private_installed_cmd.py -q --tb=short 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -ne 0) {
            $last = $output.Substring([Math]::Max(0, $output.Length - 14000))
            for ($i=0; $i -lt $last.Length; $i+=2300) { Write-Host ('::error title=Phase 3 synthetic failure::' + (($last.Substring($i,[Math]::Min(2300,$last.Length-$i)) -replace '%','%25') -replace "`n",'%0A' -replace "`r",'%0D')) }
            throw 'Synthetic byte/anchor regressions failed'
          }
      - name: Compile BOTH real Inno presets and install/uninstall opaque private fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) { throw 'Inno Setup compiler is required' }
          $work = Join-Path $env:RUNNER_TEMP ('phase3-inno-' + [guid]::NewGuid().ToString('N'))
          $payload = Join-Path $work 'opaque-payload'
          $profile = Join-Path $work 'کاربر خصوصی ! & Local AppData'
          $selected = Join-Path $work 'مسیر انتخابی ! & VIRA'
          New-Item -ItemType Directory -Force $payload, $profile | Out-Null
          $env:LOCALAPPDATA = $profile
          New-Item -ItemType Directory -Force (Join-Path $payload 'python'), (Join-Path $payload 'app'), (Join-Path $payload 'native/pdf/bin') | Out-Null
          # Deliberately NOT executable/native material. NEVER launch this fixture.
          [IO.File]::WriteAllText((Join-Path $payload 'python/python.exe'), 'OPAQUE NOT AN INTERPRETER')
          [IO.File]::WriteAllText((Join-Path $payload 'app/private_installed_source.py'), '# opaque installer fixture, never executed')
          [IO.File]::WriteAllText((Join-Path $payload 'native/pdf/bin/synthetic.dll'), 'OPAQUE NOT A DLL')
          [IO.File]::WriteAllText((Join-Path $payload 'start_vira.cmd'), '@exit /b 99')
          $anchor = Join-Path $work 'anchor-input.json'
          @{schema=1;role='PRIVATE_SOURCE_INSTALLED_ANCHOR';manifest_sha256=('a'*64);inventory_sha256=('b'*64);source_audit_sha256=('c'*64);port=8787;no_browser=$true} | ConvertTo-Json | Set-Content -LiteralPath $anchor -Encoding utf8
          $publicOutput = (& $iscc "/DAppVersion=99.30.0" "/DAppSource=$payload" "/O$work/public-compile-only" installer/vira.iss 2>&1 | Out-String)
          Write-Host $publicOutput
          if ($LASTEXITCODE -ne 0) { Write-Host ('::error title=Public Inno compiler failure::' + (($publicOutput.Substring([Math]::Max(0,$publicOutput.Length-6000)) -replace '%','%25') -replace "`n",'%0A' -replace "`r",'%0D')); throw 'Public-default Inno compile regressed' }
          $privateOutput = (& $iscc '/DPrivateSourceCI' "/DPrivateSourceAnchor=$anchor" "/DPrivateSourceProfile=$profile" "/DAppVersion=99.30.0" "/DAppSource=$payload" "/O$work/private" installer/vira.iss 2>&1 | Out-String)
          Write-Host $privateOutput
          if ($LASTEXITCODE -ne 0) { Write-Host ('::error title=Private Inno compiler failure::' + (($privateOutput.Substring([Math]::Max(0,$privateOutput.Length-6000)) -replace '%','%25') -replace "`n",'%0A' -replace "`r",'%0D')); throw 'Private Inno compile failed' }
          $ordinary = Join-Path $profile 'VIRA/data/ordinary-sentinel.txt'
          New-Item -ItemType Directory -Force (Split-Path $ordinary) | Out-Null
          [IO.File]::WriteAllText($ordinary, 'ordinary business data must remain untouched')
          $before = (Get-FileHash -LiteralPath $ordinary).Hash
          $setup = Join-Path $work 'private/VIRA-Setup-99.30.0.exe'
          $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/TASKS=""',('/DIR="' + $selected + '"'))
          $process = Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Private Inno install exit $($process.ExitCode)" }
          $installedAnchor = Join-Path $profile 'VIRA/private-native-installed/anchor.json'
          if (-not (Test-Path -LiteralPath (Join-Path $selected 'native/pdf/bin/synthetic.dll'))) { throw 'Selected directory was not used' }
          if ((Get-FileHash -LiteralPath $installedAnchor).Hash -ne (Get-FileHash -LiteralPath $anchor).Hash) { throw 'Independent external anchor not copied intact' }
          $receipt = Join-Path $profile 'VIRA/private-native-installed/state/receipts/preserve.txt'
          New-Item -ItemType Directory -Force (Split-Path $receipt) | Out-Null
          [IO.File]::WriteAllText($receipt, 'private receipt must survive uninstall')
          $again = Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru
          if ($again.ExitCode -eq 0) { throw 'Existing private anchor/state was overwritten' }
          $uninstall = Start-Process -FilePath (Join-Path $profile 'VIRA/private-native-installed/uninstaller/unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Private uninstall failed' }
          if (-not (Test-Path -LiteralPath $receipt) -or -not (Test-Path -LiteralPath $installedAnchor) -or (Get-FileHash -LiteralPath $ordinary).Hash -ne $before) { throw 'Data/anchor preservation failed' }
          $proof = @{role='PHASE3_INNO_MECHANICS_AND_SYNTHETIC_BYTES_ONLY';real_inno_install_uninstall=$true;selected_unicode_space_bang_ampersand_path=$true;ordinary_and_private_data_preserved=$true;existing_private_state_rejected=$true;native_runtime_executed=$false;real_native_delta_rollback_proven=$false;phase3_complete=$false;release_authorized=$false}
          Write-Host ('::notice title=Phase 3 LIMITED preflight::' + ($proof | ConvertTo-Json -Compress))
