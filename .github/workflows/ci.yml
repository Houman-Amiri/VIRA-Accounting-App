# CI — Windows-native mandate: no Docker/service containers (Phase 6 §5).
# Toolchains are installed directly on GitHub-hosted runners.
name: CI

on:
  workflow_dispatch:
  push:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, type, security, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (lockfile check)
        run: |
          uv lock --check   # fails clearly when pyproject.toml and uv.lock drift
          uv sync --frozen --all-extras

      - name: Ruff (lint)
        run: uv run ruff check backend/app backend/tests scripts

      - name: Mypy (types)
        run: uv run mypy backend/app

      - name: Bandit (security)
        run: uv run bandit -r backend/app -ll -q

      - name: pip-audit (dependencies)
        run: |
          mkdir -p reports
          set +e
          uv run pip-audit > reports/dependency-audit.log 2>&1
          status=$?
          set -e
          cat reports/dependency-audit.log
          if [ "$status" -ne 0 ]; then
            python - <<'PYDIAG'
          from pathlib import Path
          tail = Path('reports/dependency-audit.log').read_text(encoding='utf-8', errors='replace')[-8000:]
          for offset in range(0, len(tail), 2600):
              part = tail[offset:offset+2600].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Dependency audit failure part {offset}::{part}')
          PYDIAG
          fi
          exit "$status"

      - name: Fresh SQLite + migrations
        working-directory: backend
        env:
          SQLITE_DATABASE_PATH: ${{ runner.temp }}/vira-ci.sqlite3
        run: uv run alembic upgrade head

      - name: Pytest + Hypothesis invariants
        env:
          SQLITE_DATABASE_PATH: ${{ runner.temp }}/vira-ci.sqlite3
        run: |
          mkdir -p reports
          uv run pytest -q --junitxml=reports/pytest.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/
          retention-days: 14

  frontend:
    name: Frontend — lint, types, contract, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install (frozen lockfile — fails on drift)
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Prettier
        working-directory: frontend
        run: pnpm format:check

      - name: ESLint
        working-directory: frontend
        run: pnpm lint

      - name: TypeScript
        working-directory: frontend
        run: pnpm typecheck

      - name: npm audit (critical gate; 1 accepted dev-only high is documented)
        working-directory: frontend
        run: pnpm audit --audit-level critical

      - name: Vitest
        working-directory: frontend
        run: |
          mkdir -p ../reports
          pnpm vitest run --reporter=default --reporter=junit --outputFile.junit=../reports/vitest.xml

      - name: Build
        working-directory: frontend
        run: pnpm build

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-reports
          path: reports/
          retention-days: 14

      - name: Upload SPA build
        uses: actions/upload-artifact@v4
        with:
          name: spa-dist
          path: frontend/dist/
          retention-days: 14

  contract:
    name: OpenAPI contract is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: uv sync --frozen --all-extras
      - working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Regenerate schema from a live FastAPI app (temp SQLite)
        env:
          SQLITE_DATABASE_PATH: ${{ runner.temp }}/vira-contract.sqlite3
        run: |
          uv run python - <<'PY'
          import json
          from app.main import app
          json.dump(app.openapi(), open("backend/openapi.json", "w"), indent=2, ensure_ascii=False)
          PY
          cd frontend && pnpm openapi-ts

      - name: Generated types must be committed (reviewable in GitHub Web)
        run: |
          if ! git diff --exit-code backend/openapi.json frontend/src/api/schema.d.ts; then
            echo "::error::OpenAPI schema/types out of date — run: python dump openapi.json && pnpm openapi-ts"
            exit 1
          fi

  e2e:
    name: Playwright e2e (native processes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: uv sync --frozen --all-extras
      - working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Migrations for the e2e database
        working-directory: backend
        env:
          SQLITE_DATABASE_PATH: ${{ runner.temp }}/vira-e2e.sqlite3
        run: uv run alembic upgrade head

      - name: Seed charts + owner user for e2e
        env:
          SQLITE_DATABASE_PATH: ${{ runner.temp }}/vira-e2e.sqlite3
          VIRA_ADMIN_PASSWORD: e2e-owner-password
        run: uv run python -m app.seed

      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright smoke (backend + Vite dev launched natively)
        working-directory: frontend
        env:
          SQLITE_DATABASE_PATH: ${{ runner.temp }}/vira-e2e.sqlite3
          VIRA_E2E_DISPOSABLE_DATABASE: "1"
          VIRA_E2E_USER: owner
          VIRA_E2E_PASSWORD: e2e-owner-password
        run: |
          set -o pipefail
          pnpm e2e 2>&1 | tee ../e2e.log

      - name: Publish e2e failure to annotations (log access is restricted)
        if: failure()
        run: |
          echo "::notice title=e2e-log-head::$(head -c 2500 e2e.log | tr '\n' '|' | tr ',' ';')"
          echo "::notice title=e2e-log-tail::$(tail -c 3500 e2e.log | tr '\n' '|' | tr ',' ';')"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  windows-native:
    name: Windows-native smoke (SQLite paths, venv, build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Parse PowerShell release scripts
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "$($_.Name): $($errors | Out-String)" }
          }

      - name: Backend deps + migrations + tests (native Windows)
        shell: pwsh
        run: |
          $env:SQLITE_DATABASE_PATH = Join-Path $env:RUNNER_TEMP "vira-win.sqlite3"
          uv sync --frozen --all-extras
          Set-Location backend
          uv run alembic upgrade head
          Set-Location ..
          $out = (uv run pytest -q --tb=short 2>&1 | Out-String)
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            $last = $out.Substring([Math]::Max(0, $out.Length - 8000))
            for ($i = 0; $i -lt $last.Length; $i += 2600) {
              $part = $last.Substring($i, [Math]::Min(2600, $last.Length - $i))
              $part = (($part -replace '%','%25') -replace "`r",'%0D') -replace "`n",'%0A'
              Write-Host "::error title=pytest (native Windows) part ${i}::$part"
            }
            throw "pytest failed on native Windows"
          }

      - name: Prepare hash-pinned native PDF fixture (test-only, no system GTK)
        shell: pwsh
        run: ./scripts/prepare_pdf_native_fixture.ps1

      - name: Strict real PDF and embedded Vazirmatn (native Windows)
        shell: pwsh
        run: |
          $out = (uv run python scripts/pdf_native_smoke.py --app-root "$env:VIRA_PDF_PROOF_APP_ROOT" --out-dir reports/native-pdf 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) {
            $tail = $out.Substring([Math]::Max(0, $out.Length - 5000))
            Write-Host "::error title=native PDF proof::$((($tail -replace '%','%25') -replace "`r",'%0D') -replace "`n",'%0A')"
            throw "native PDF/font proof failed; HTML is not accepted"
          }
          $env:VIRA_REQUIRE_NATIVE_PDF = "1"
          $out = (uv run pytest backend/tests/test_operations.py::test_proforma_document_renders -q 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) {
            $tail = $out.Substring([Math]::Max(0, $out.Length - 5000))
            Write-Host "::error title=native PDF API::$((($tail -replace '%','%25') -replace "`r",'%0D') -replace "`n",'%0A')"
            throw "actual authenticated proforma API must return embedded-font PDF"
          }

      - name: Upload synthetic native PDF evidence (no DLL binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-pdf-proof
          path: reports/native-pdf/
          if-no-files-found: warn
          retention-days: 14

      - name: Frontend install + build (native Windows)
        working-directory: frontend
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Private bundled CPython PDF and minimal native closure proof
        shell: pwsh
        run: |
          $out = (pwsh -NoProfile -File ./scripts/pdf_payload_smoke.ps1 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) {
            $tail = $out.Substring([Math]::Max(0, $out.Length - 3000))
            Write-Host "::error title=private bundled PDF proof::$((($tail -replace '%','%25') -replace "`r",'%0D') -replace "`n",'%0A')"
            throw "private bundled PDF proof failed"
          }

      - name: Upload private bundled PDF audit (no app, interpreter or native binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundled-pdf-audit
          path: reports/bundled-pdf/
          if-no-files-found: warn
          retention-days: 14

      - name: Real in-app delta apply and rollback (isolated Windows, current-code fixtures)
        shell: pwsh
        run: |
          Push-Location frontend
          pnpm exec playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw "Chromium install failed" }
          Pop-Location
          $out = (uv run python scripts/update_native_smoke.py 2>&1 | Out-String)
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            $tail = $out.Substring([Math]::Max(0, $out.Length - 3000))
            Write-Host "::error title=native in-app update::$((($tail -replace '%','%25') -replace "`r",'%0D') -replace "`n",'%0A')"
            throw "native in-app delta journey failed"
          }

      - name: Public 1.0.10 real schema migration and compiled-helper database rollback
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "vira-schema-base-1.0.10.zip"
          gh release download v1.0.10 --repo Houman-Amiri/VIRA-Accounting-App --pattern vira-v1.0.10-app.zip --output $archive
          if ($LASTEXITCODE -ne 0) { throw "published 1.0.10 download failed" }
          Install-Module ps2exe -Force -Scope CurrentUser -ErrorAction Stop
          Import-Module ps2exe -ErrorAction Stop
          $helper = Join-Path $env:RUNNER_TEMP "vira-schema-gate-updater.exe"
          Invoke-ps2exe -inputFile scripts/vira_updater.ps1 -outputFile $helper -noConsole:$false
          if (-not (Test-Path $helper)) { throw "compiled helper missing" }
          $out = (uv run python scripts/schema_rollback_smoke.py --archive $archive --helper $helper 2>&1 | Out-String)
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            $tail = $out.Substring([Math]::Max(0, $out.Length - 3500))
            Write-Host "::error title=schema rollback::$((($tail -replace '%','%25') -replace "`r",'%0D') -replace "`n",'%0A')"
            throw "published schema rollback gate failed"
          }
