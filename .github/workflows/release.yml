# Release — annotated `vX.Y.Z` tags only (Phase 6 §6 + Phase 8).
# No Docker, no container registry. Windows-native artifacts only.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    name: Full test suite
    uses: ./.github/workflows/ci.yml

  package:
    name: Build & publish release assets
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # delta generation needs previous release tags

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build SPA + sync backend deps
        shell: pwsh
        run: |
          uv sync --frozen
          Set-Location frontend
          pnpm install --frozen-lockfile
          pnpm build

      - name: Package source/build artifacts + latest.json + SHA256SUMS + Persian notes
        shell: pwsh
        run: ./scripts/package_release.ps1 -Version "${{ github.ref_name }}" -OutDir dist-release

      - name: Stage app payload (backend + SPA + scripts + manifests)
        shell: pwsh
        run: |
          ./scripts/stage_app_payload.ps1 -Version "${{ github.ref_name }}" -OutDir dist-release/app

      - name: Compile Inno Setup installer (Phase 8 §1)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after installing Inno Setup" }
          & $iscc installer/vira.iss "/DAppVersion=${{ github.ref_name }}" "/DAppSource=..\dist-release\app"
          if ($LASTEXITCODE -ne 0) { throw "iscc failed with exit code $LASTEXITCODE" }
          Get-ChildItem installer/Output/*.exe | Copy-Item -Destination dist-release/

      - name: Compile vira-updater.exe (Phase 8 §6)
        shell: pwsh
        run: |
          Install-Module ps2exe -Force -Scope CurrentUser
          Import-Module ps2exe
          Invoke-ps2exe -inputFile scripts/vira_updater.ps1 -outputFile dist-release/app/vira-updater.exe -noConsole:$false
          if (-not (Test-Path dist-release/app/vira-updater.exe)) { throw "ps2exe did not produce vira-updater.exe" }
          Copy-Item dist-release/app/vira-updater.exe dist-release/vira-updater.exe

      - name: Delta update packages vs previous release tags (Phase 8 §5)
        shell: pwsh
        env:
          VIRA_UPDATE_SIGNING_KEY: ${{ secrets.VIRA_UPDATE_SIGNING_KEY }}
        run: |
          ./scripts/build_deltas.ps1 -Version "${{ github.ref_name }}" -OutDir dist-release

      - name: Windows install/upgrade/rollback smoke test (Phase 8 §9)
        shell: pwsh
        run: |
          ./scripts/windows_smoke_test.ps1 -Setup (Get-ChildItem dist-release/VIRA-Setup-*.exe | Select-Object -First 1).FullName

      - name: Upload workflow artifact (full setup + assets)
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ github.ref_name }}
          path: dist-release/
          retention-days: 90

      - name: Publish GitHub Release (installer, deltas, latest.json, SHA256SUMS, Persian notes)
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          body_path: dist-release/release-notes-fa.md
          fail_on_unmatched_files: false
          draft: false
