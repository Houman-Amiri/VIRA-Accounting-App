# Release — annotated `vX.Y.Z` tags only (Phase 6 §6 + Phase 8).
# No Docker, no container registry. Windows-native artifacts only.
name: Release

on:
  push:
    tags: ["v*"]
    branches: ["**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package (X.Y.Z) — pipeline debugging without a tag"
        required: true
        default: "0.0.0-debug"


permissions:
  contents: write

env:
  # Tags/dispatch use the requested version; branch dry runs read pyproject.toml.
  VIRA_VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}

jobs:
  test:
    name: Full test suite
    if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release-dry-run]') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  package:
    name: Build & publish release assets
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release-dry-run]') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # delta generation needs previous release tags

      - name: Resolve branch dry-run version
        shell: pwsh
        run: |
          if (-not $env:VIRA_VERSION) {
            $versionLine = Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
            if (-not $versionLine) { throw "project version not found" }
            "VIRA_VERSION=$($versionLine.Matches[0].Groups[1].Value)" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Refuse unsigned tagged publication before building assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          VIRA_UPDATE_SIGNING_KEY: ${{ secrets.VIRA_UPDATE_SIGNING_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VIRA_UPDATE_SIGNING_KEY)) {
            throw "Tagged publication requires the configured Ed25519 signing key; no unsigned fallback"
          }

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build SPA + sync backend deps
        shell: pwsh
        run: |
          uv sync --frozen --all-extras
          Set-Location frontend
          pnpm install --frozen-lockfile
          pnpm build

      # Compiled FIRST so the helper is inside {app} (setup), inside the app
      # payload zip (delta base) and inside every delta — before v1.0.5 it was
      # built after both, so an installed app could not find it at apply time.
      - name: Compile vira-updater.exe (Phase 8 §6)
        shell: pwsh
        run: |
          $out = ""
          try {
            New-Item -ItemType Directory -Force -Path dist-release/app | Out-Null
            # PSGallery intermittently refuses downloads; a release must not fail on
            # a transient mirror error, and must still fail loudly after real retries.
            $installed = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Install-Module ps2exe -Force -Scope CurrentUser -ErrorAction Stop
                Import-Module ps2exe -ErrorAction Stop
                $installed = $true
                break
              } catch {
                Write-Host "ps2exe install attempt $attempt failed: $($_.Exception.Message)"
                Start-Sleep -Seconds (15 * $attempt)
              }
            }
            if (-not $installed) { throw "ps2exe could not be installed after 3 real attempts" }
            $out = (Invoke-ps2exe -inputFile scripts/vira_updater.ps1 -outputFile dist-release/app/vira-updater.exe -noConsole:$false *>&1 | Out-String)
            Write-Host $out
            if (-not (Test-Path dist-release/app/vira-updater.exe)) { throw "ps2exe did not produce vira-updater.exe" }
            Copy-Item dist-release/app/vira-updater.exe dist-release/vira-updater.exe
          } catch {
            $out += "`n" + ($_ | Out-String)
            $tail = $out.Substring([Math]::Max(0, $out.Length - 3000))
            Write-Host ("::error title=compiled updater::" + $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A'))
            throw
          }

      - name: Package source/build artifacts + latest.json + SHA256SUMS + Persian notes
        shell: pwsh
        run: ./scripts/package_release.ps1 -Version "${{ env.VIRA_VERSION }}" -OutDir dist-release

      - name: Stage app payload (backend + SPA + scripts + manifests)
        shell: pwsh
        run: |
          ./scripts/stage_app_payload.ps1 -Version "${{ env.VIRA_VERSION }}" -OutDir dist-release/app

      - name: Package install-layout payload (delta base + portable app)
        shell: pwsh
        run: |
          # vira-<v>-app.zip IS the {app} directory — the only downloadable base
          # whose install_manifest.json matches real installs (v1.0.4 fix). Deltas
          # of the future are built against it; users can also unzip and run it.
          Compress-Archive -Path dist-release/app/* -DestinationPath "dist-release/vira-${{ env.VIRA_VERSION }}-app.zip"

      - name: Compile Inno Setup installer (Phase 8 §1)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after installing Inno Setup" }
          & $iscc installer/vira.iss "/DAppVersion=${{ env.VIRA_VERSION }}" "/DAppSource=..\dist-release\app" 2>&1 | Tee-Object -Variable out
          if ($LASTEXITCODE -ne 0) {
            $flat = ($out | Out-String) -replace "\r?\n", "|" -replace ",", ";"
            if ($flat.Length -gt 3000) { $flat = $flat.Substring(0, 3000) }
            echo "::notice title=iscc-output::$flat"
            throw "iscc failed with exit code $LASTEXITCODE"
          }
          Get-ChildItem installer/Output/*.exe | Copy-Item -Destination dist-release/

      - name: Delta update packages vs previous release tags (Phase 8 §5)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VIRA_UPDATE_SIGNING_KEY: ${{ secrets.VIRA_UPDATE_SIGNING_KEY }}
        run: |
          $out = (pwsh -NoProfile -File ./scripts/build_deltas.ps1 -Version "${{ env.VIRA_VERSION }}" -OutDir dist-release *>&1 | Out-String)
          Write-Host $out
          "## build_deltas transcript" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          ('```') | Out-File -Append $env:GITHUB_STEP_SUMMARY
          $out | Out-File -Append $env:GITHUB_STEP_SUMMARY
          ('```') | Out-File -Append $env:GITHUB_STEP_SUMMARY
          if ($LASTEXITCODE -ne 0) {
            ($out -split "`n") | Select-Object -Last 30 | ForEach-Object {
              if ($_.Trim()) { Write-Host "::error title=build_deltas::$(($_ -replace '%','%25') -replace "`r",'')" }
            }
            throw "build_deltas failed (exit $LASTEXITCODE)"
          }

      - name: Validate real delta ZIPs with the shipped staging validator
        shell: pwsh
        run: |
          @'
          import os
          import re
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from app.services.update_staging import extract_delta
          version = os.environ["VIRA_VERSION"].removeprefix("v")
          bases = set()
          for archive in sorted(Path("dist-release").glob(f"VIRA-v{version}-delta-from-v*.zip")):
              match = re.fullmatch(r"VIRA-v[\d.]+-delta-from-v([\d.]+)\.zip", archive.name)
              if not match:
                  raise ValueError(f"Unexpected delta name: {archive.name}")
              base = match[1]
              with TemporaryDirectory() as tmp:
                  extract_delta(archive, Path(tmp) / "payload", base, version)
              bases.add(base)
              print(f"Validated real delta {base} -> {version}: {archive.stat().st_size} bytes")
          if version == "1.0.8" and not {"1.0.6", "1.0.7"}.issubset(bases):
              raise ValueError("v1.0.8 requires direct deltas from both installed baselines 1.0.6 and 1.0.7")
          if version == "1.0.9" and bases != {"1.0.6", "1.0.7", "1.0.8"}:
              raise ValueError("v1.0.9 requires direct deltas from installed baselines 1.0.6, 1.0.7 and 1.0.8")
          if version == "1.0.10" and bases != {"1.0.7", "1.0.8", "1.0.9"}:
              raise ValueError("v1.0.10 requires direct deltas from 1.0.7, 1.0.8 and the confirmed 1.0.9 client")
          # Any newer version must keep the three most recent direct baselines; a
          # frozen per-version list is what silently dropped this coverage before.
          def key(v):
              return tuple(int(x) for x in v.split("."))
          if key(version) > (1, 0, 10) and (len(bases) != 3 or any(key(b) >= key(version) for b in bases)):
              raise ValueError(f"v{version} requires three direct deltas from older published baselines, got {sorted(bases)}")
          '@ | uv run python -
          if ($LASTEXITCODE -ne 0) { throw "real delta staging validation failed" }

      - name: Published 1.0.9 client -> candidate native in-app update with compiled updater (isolated, no client injection)
        if: ${{ !startsWith(env.VIRA_VERSION, '0.0.0') }}
        shell: pwsh
        run: |
          pnpm --dir frontend exec playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw "browser install failed" }
          $baseDir = Join-Path ([IO.Path]::GetTempPath()) "vira-delta-base/base-1.0.9"
          $baseManifest = Get-ChildItem $baseDir -Recurse -Filter install_manifest.json | Select-Object -First 1
          if (-not $baseManifest) {
            throw "the pinned published 1.0.9 client base is missing: keep its delta baseline in the window or add the next independently pinned client digest before releasing"
          }
          $code = 1
          $out = ""
          try {
            $out = (& uv run python scripts/update_native_smoke.py --published-base $baseManifest.Directory.FullName --packages dist-release --target-version $env:VIRA_VERSION *>&1 | Out-String)
            $code = $LASTEXITCODE
          } catch { $out += "`n" + ($_ | Out-String) }
          Write-Host $out
          if ($code -ne 0) {
            $tail = $out.Substring([Math]::Max(0, $out.Length - 3000))
            $tail = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=published client upgrade::$tail"
            throw "published 1.0.9 browser upgrade/rollback failed"
          }

      - name: Upload the real in-app updater assertion on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: in-app-updater-diagnostics
          path: reports/in-app-audit-failure-*.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Windows install/upgrade/rollback smoke test (Phase 8 §9)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = (Get-ChildItem dist-release/VIRA-Setup-*.exe | Select-Object -First 1).FullName
          $out = ""
          try {
            $out = (& ./scripts/windows_smoke_test.ps1 -Setup $setup *>&1 | Out-String)
          } catch {
            $out += "`nEXCEPTION: " + ($_ | Out-String)
          }
          Write-Output $out
          if ($out -notmatch "all legs passed") {
            $flat = $out -replace "\r?\n", "|" -replace ",", ";"
            if ($flat.Length -gt 3000) { $flat = $flat.Substring($flat.Length - 3000) }
            echo "::notice title=smoke-output::$flat"
            throw "windows smoke test failed"
          }

      - name: Final signature and complete checksums after all packaging and smoke steps
        shell: pwsh
        env:
          VIRA_UPDATE_SIGNING_KEY: ${{ secrets.VIRA_UPDATE_SIGNING_KEY }}
        run: |
          uv run python scripts/finalize_release_assets.py dist-release
          if ($LASTEXITCODE -ne 0) { throw "Final release signing/checksum verification failed" }

      - name: Upload workflow artifact (full setup + assets)
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ env.VIRA_VERSION }}
          path: dist-release/
          retention-days: 90

      - name: Publish GitHub Release (installer, deltas, latest.json, SHA256SUMS, Persian notes)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          body_path: dist-release/release-notes-fa.md
          fail_on_unmatched_files: false
          draft: false
