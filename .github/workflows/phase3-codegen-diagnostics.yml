name: Read original native transaction failure without rebuilding

on:
  push:
    paths: ['.github/workflows/phase3-codegen-diagnostics.yml']

permissions:
  contents: read
  actions: read

jobs:
  read-failed-producer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Authenticate passed NativeB and recover failed transaction step only
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, os, subprocess, zipfile
          repo = os.environ['GH_REPO']
          def api(path):
              return json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/{path}']))
          def notice(title, value):
              text = json.dumps(value).replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print(f'::notice title={title}::{text}', flush=True)
          run_id, job_id = 40190780548, 121182331473
          head = 'ecf68651ba2470a0fe8b43f787396032e1a5ab51'
          run = api(f'actions/runs/{run_id}')
          job = api(f'actions/jobs/{job_id}')
          assert run['head_sha'] == head and run['path'] == '.github/workflows/pdf-desktop-source.yml'
          assert job['run_id'] == run_id and job['conclusion'] == 'failure'
          steps = {s['name']:s['conclusion'] for s in job['steps']}
          assert steps['Phase3 independently cold-build genuine native codegen target NOT delta acceptance'] == 'success'
          assert steps['Phase3 REAL in-app signed native delta and forced rollback with preserved accounting'] == 'failure'
          artifact_id = 12604415038
          artifact = api(f'actions/artifacts/{artifact_id}')
          assert artifact['workflow_run']['id'] == run_id and artifact['workflow_run']['head_sha'] == head
          assert artifact['name'] == 'private-phase3-independent-codegen-source21-NOT-delta-proof' and not artifact['expired']
          archive = subprocess.check_output(['gh','api',f'repos/{repo}/actions/artifacts/{artifact_id}/zip'])
          digest = hashlib.sha256(archive).hexdigest()
          assert artifact['digest'] == 'sha256:' + digest
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              names = [n for n in z.namelist() if n.split('/')[-1] == 'verified-codegen-target.json']
              assert len(names) == 1
              raw = z.read(names[0])
              audit = json.loads(raw)
              proof = audit['private_codegen_variant']
              assert audit['dll_count'] == 21 and len(audit['preferred_source_trees']) == 20
              assert proof['native_executable_text_changed'] and not proof['native_delta_rollback_proven']
              notice('Authenticated NativeB success not transaction success',dict(run=run_id,job=job_id,head=head,artifact=artifact_id,zip_sha256=digest,witness_sha256=hashlib.sha256(raw).hexdigest(),native_text_changed=True,pango=proof['actual_pango_version_string'],before_text_sha256=proof['before_text_sha256'],after_text_sha256=proof['after_text_sha256'],dll_count=21,source_count=20,transaction_success=False))
          fetch = subprocess.run(['gh','api',f'repos/{repo}/actions/runs/{run_id}/logs'],capture_output=True)
          if fetch.returncode:
              notice('Original log transport failure',dict(code=fetch.returncode,error=fetch.stderr.decode(errors='replace')[-1600:]))
              fetch.check_returncode()
          logs = fetch.stdout
          with zipfile.ZipFile(io.BytesIO(logs)) as z:
              names = [n for n in z.namelist() if 'source-http-consumer' in n.lower() and 'real in-app' in n.lower()]
              if len(names) != 1:
                  notice('Original log member index',dict(names=[n for n in z.namelist() if 'source' in n.lower()][:12]))
                  # Some Actions log archives expose one consolidated job log.
                  names = [n for n in z.namelist() if 'source-http-consumer' in n.lower() and '/' not in n]
              assert len(names) == 1, 'Unique original transaction/job log required'
              raw = z.read(names[0])
              marker = raw.rfind(b'Traceback (most recent call last)')
              tail = raw[marker:marker+6000] if marker >= 0 else raw[-6000:]
              notice('Original failed transaction log provenance',dict(run=run_id,job=job_id,member=names[0],complete_bytes=len(raw),complete_sha256=hashlib.sha256(raw).hexdigest(),tail_bytes=len(tail),tail_sha256=hashlib.sha256(tail).hexdigest()))
              # Base64 avoids GitHub corrupting ANSI escapes in JSON notices.
              # At most six parts; stay below the ten-notice per-step ceiling.
              encoded = base64.b64encode(tail).decode()
              parts = [encoded[i:i+2000] for i in range(0,len(encoded),2000)]
              assert len(parts) <= 6
              for i, data in enumerate(parts):
                  notice('Original transaction failure tail',dict(part=i,total=len(parts),data=data))
          PY
      - name: Recover original owned native-commit launcher log, never database or keys
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,io,json,os,subprocess,zipfile,zlib
          repo=os.environ['GH_REPO']; artifact_id=12603259611
          meta=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/artifacts/{artifact_id}']))
          assert meta['workflow_run']['id']==40190780548 and meta['workflow_run']['head_sha']=='ecf68651ba2470a0fe8b43f787396032e1a5ab51'
          assert meta['name']=='private-phase3-real-native-transaction-no-app-db-dlls-NOT-crash-recovery' and not meta['expired']
          archive=subprocess.check_output(['gh','api',f'repos/{repo}/actions/artifacts/{artifact_id}/zip'])
          digest=hashlib.sha256(archive).hexdigest()
          assert meta['digest']=='sha256:'+digest and digest=='fb19d1e4021a9a855fb60edc875409b74147448ff4c72863a7a7dd83a265d7bb'
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              names=z.namelist()
              print('::notice title=Original transaction artifact members::'+json.dumps(dict(artifact=artifact_id,zip_sha256=digest,names=names)))
              selected=[n for n in names if n.endswith('native-commit/launcher.log')]
              assert len(selected)==1
              raw=z.read(selected[0]); assert len(raw)<2*1024*1024
              encoded=base64.b64encode(zlib.compress(raw,9)).decode()
              parts=[encoded[i:i+2000] for i in range(0,len(encoded),2000)]
              assert len(parts)<=8,'Need split jobs, never truncate the owned log'
              print('::notice title=Original owned launcher provenance::'+json.dumps(dict(member=selected[0],bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),parts=len(parts))))
              for i,data in enumerate(parts):
                  print('::notice title=Original owned launcher evidence::'+json.dumps(dict(part=i,total=len(parts),data=data)))
          PY
